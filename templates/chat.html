<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新氧连锁数据智能运营助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-mark-cn">S</span>
          </span>
          <div>
            <h1>新氧数据助手</h1>
            <p>连锁经营 RAG 问答工作台</p>
          </div>
        </div>

        <section class="panel session-panel">
          <div class="panel-title">
            <span>对话任务</span>
            <button id="new-session" class="tiny-action" type="button">新建</button>
          </div>
          <div id="sessions" class="session-list" aria-label="对话任务列表"></div>
        </section>

        <section class="panel">
          <div class="panel-title">
            <span>阶段能力</span>
            <span class="status-dot">MVP</span>
          </div>
          <ul class="capability-list">
            <li><span>意图</span>规则意图识别</li>
            <li><span>检索</span>SQLite 知识库召回</li>
            <li><span>生成</span>DeepSeek RAG 回答</li>
            <li><span>口径</span>SQL 与引用来源</li>
          </ul>
        </section>

        <section class="panel">
          <div class="panel-title">
            <span>示例问题</span>
            <span class="status-dot soft">Try</span>
          </div>
          <button class="example" data-question="L0灌券为什么会拖累毛利？">L0灌券为什么会拖累毛利？</button>
          <button class="example" data-question="帮我复盘一下5月品项毛利率">帮我复盘一下5月品项毛利率</button>
          <button class="example" data-question="品项毛利率怎么算？">品项毛利率怎么算？</button>
          <button class="example" data-question="毛利率主表有哪些字段？">毛利率主表有哪些字段？</button>
        </section>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">DeepSeek RAG · Chain Analytics</p>
            <h2>连锁经营问答工作台</h2>
          </div>
          <a class="health-link" href="/health" target="_blank" rel="noreferrer">服务状态</a>
        </header>

        <section class="insight-strip" aria-label="核心分析对象">
          <div>
            <span class="metric-label">分析主题</span>
            <strong>毛利率 / 补贴 / 品项结构</strong>
          </div>
          <div>
            <span class="metric-label">响应模式</span>
            <strong>检索 + 生成 + 引用</strong>
          </div>
          <div>
            <span class="metric-label">知识来源</span>
            <strong>SQLite KB / DeepSeek</strong>
          </div>
        </section>

        <div id="messages" class="messages">
          <article class="message assistant">
            <div class="bubble">
              <p class="summary">正在读取本地聊天历史...</p>
            </div>
          </article>
        </div>

        <form id="chat-form" class="composer">
          <input id="question" name="question" type="text" autocomplete="off" placeholder="输入经营问题，例如：L0灌券为什么会拖累毛利？" aria-label="经营问题">
          <button type="submit">发送</button>
        </form>
      </section>
    </main>

    <template id="user-template">
      <article class="message user">
        <div class="bubble"></div>
      </article>
    </template>

    <template id="assistant-template">
      <article class="message assistant">
        <div class="bubble">
          <div class="answer-head">
            <span class="intent"></span>
            <span class="confidence"></span>
          </div>
          <p class="summary"></p>
          <div class="sections"></div>
          <details class="sql-block">
            <summary>查看生成 SQL</summary>
            <pre><code></code></pre>
          </details>
          <div class="caliber"></div>
        </div>
      </article>
    </template>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
  </body>
</html>
